global
  log /dev/log local0
  log /dev/log local1 notice
  daemon
  maxconn 2048

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  timeout connect 5s
  timeout client  50s
  timeout server  50s

frontend http_front
  bind *:80
  default_backend app_backend

backend app_backend
  balance roundrobin
  option httpchk GET /
  http-check expect status 200
  http-response set-header X-Backend %[srv_name]

  server app1 192.168.xx.xx:3000 check
  server app2 192.168.xx.xx:3000 check
  server app3 192.168.xx.xx:3000 check

listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
  stats show-legends
