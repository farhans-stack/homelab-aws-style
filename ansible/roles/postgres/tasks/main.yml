- name: Install PostgreSQL
  apt:
    name:
      - postgresql
    state: present

- name: Ensure PostgreSQL is running
  systemd:
    name: postgresql
    enabled: true
    state: started

- name: Allow Postgres to listen on all interfaces
  lineinfile:
    path: /etc/postgresql/14/main/postgresql.conf
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Ensure pg_hba allows app subnet
  lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    line: "host    all             all             {{ app_subnet_cidr }}            scram-sha-256"
    insertafter: EOF
  notify: Restart PostgreSQL

- name: Create database user
  become_user: postgres
  command: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ pg_user }}'" 
  register: pg_user_exists
  changed_when: false

- name: Create user if missing
  become_user: postgres
  command: psql -c "CREATE USER {{ pg_user }} WITH ENCRYPTED PASSWORD '{{ pg_pass }}';"
  when: pg_user_exists.stdout.strip() != "1"

- name: Create database
  become_user: postgres
  command: psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ pg_db }}'"
  register: pg_db_exists
  changed_when: false

- name: Create db if missing
  become_user: postgres
  command: psql -c "CREATE DATABASE {{ pg_db }};"
  when: pg_db_exists.stdout.strip() != "1"

- name: Grant privileges
  become_user: postgres
  command: psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ pg_db }} TO {{ pg_user }};"
